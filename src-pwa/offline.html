<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F33" />
    <title>E-Modul PPKn — Offline</title>
    <style>
      :root {
        --navy-900: #0b1f33;
        --navy-700: #16324f;
        --gold-500: #c9a227;
        --paper: #f4f6f8;
        --ink-900: #1b2733;
        --ink-500: #5b6b7c;
        --border: #d8dee5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink-900);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 32px;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: rgba(201, 162, 39, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold-500);
        font-size: 32px;
      }
      h1 {
        font-size: 1.3rem;
        color: var(--navy-900);
        margin-bottom: 8px;
      }
      p {
        color: var(--ink-500);
        line-height: 1.6;
        margin-bottom: 16px;
      }
      .note {
        background: var(--paper);
        border-left: 3px solid var(--gold-500);
        padding: 12px 16px;
        border-radius: 4px;
        font-size: 0.85rem;
        color: var(--ink-500);
        text-align: left;
        margin-bottom: 20px;
      }
      button {
        background: var(--gold-500);
        color: var(--navy-900);
        font-weight: 600;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover {
        background: #b08f1e;
      }
      button:focus-visible {
        outline: 2px solid var(--navy-700);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📴</div>
      <h1>Anda Sedang Offline</h1>
      <p>Halaman ini belum tersedia dalam cache offline.</p>

      <div class="note">
        <strong>💡 Info:</strong> Materi yang sudah Anda buka sebelumnya tetap dapat diakses dari
        beranda. Halaman ini muncul karena Anda membuka URL baru yang belum pernah dikunjungi saat
        online.
      </div>

      <button onclick="window.location.replace('./')">Kembali ke Beranda</button>
    </div>

    <script>
      // Auto-retry saat koneksi kembali
      window.addEventListener('online', () => {
        window.location.replace('./')
      })
    </script>
  </body>
</html>
